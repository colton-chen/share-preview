name: expire
on:
  schedule:
    - cron: '0 19 * * *'   # UTC 19:00 = 台北 03:00
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/expire.py
